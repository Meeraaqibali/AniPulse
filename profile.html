<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - AniPulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <header class="sticky top-0 z-40 bg-gray-900/80 backdrop-blur-md border-b border-gray-800 px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">🎌 AniPulse</a>
    <a href="index.html" class="text-sm text-gray-400 hover:text-white">← Back</a>
  </header>

  <main id="mainContent" class="p-4 md:p-8 max-w-3xl mx-auto"></main>

  <script>
    const logged = localStorage.getItem('anipulse_loggedin') === 'true';
    const main = document.getElementById('mainContent');

    if (!logged) {
      main.innerHTML = '<div class="text-center mt-20"><p class="text-5xl mb-4">🔒</p><p class="text-xl font-semibold mb-4">You need to log in first</p><a href="login.html" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg font-bold inline-block">Log In</a></div>';
    } else {
      const username = localStorage.getItem('anipulse_username') || 'User';
      const email = localStorage.getItem('anipulse_email') || '';
      const avatar = localStorage.getItem('anipulse_avatar') || '';
      const bio = localStorage.getItem('anipulse_bio') || 'No bio yet.';

      main.innerHTML = `
        <div class="bg-gradient-to-br from-purple-900/40 to-pink-900/20 border border-purple-800/40 rounded-2xl p-6 mb-6 flex items-center gap-5">
          <div class="w-20 h-20 rounded-full bg-gradient-to-br from-purple-500 to-pink-600 flex items-center justify-center text-3xl font-bold overflow-hidden flex-shrink-0">
            ${avatar ? `<img src="${avatar}" class="w-full h-full object-cover" />` : username[0].toUpperCase()}
          </div>
          <div>
            <h1 id="displayName" class="text-2xl font-extrabold">${username}</h1>
            <p class="text-gray-400 text-sm">${email}</p>
            <p id="displayBio" class="text-gray-300 text-sm mt-2">${bio}</p>
          </div>
        </div>

        <!-- Edit Profile -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-6">
          <h2 class="text-lg font-bold text-purple-300 mb-4">⚙️ Edit Profile</h2>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Username</label>
              <input id="editUsername" type="text" value="${username}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-purple-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Bio</label>
              <textarea id="editBio" rows="3" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">${bio}</textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Avatar URL (optional)</label>
              <input id="editAvatar" type="url" value="${avatar}" placeholder="https://..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-purple-500" />
            </div>
            <button id="saveBtn" class="bg-purple-600 hover:bg-purple-700 px-6 py-2.5 rounded-lg font-bold">Save Changes</button>
            <span id="saveMsg" class="text-green-400 text-sm ml-3 hidden">✓ Saved!</span>
          </div>
        </div>

        <!-- Watchlist -->
        <div id="watchlist" class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-6">
          <h2 class="text-lg font-bold text-purple-300 mb-3">📌 My Watchlist</h2>
          <p class="text-gray-400 text-sm">No items in your watchlist yet. Browse anime to add some!</p>
        </div>

        <!-- Watch History -->
        <div id="history" class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-6">
          <h2 class="text-lg font-bold text-purple-300 mb-3">🕒 Watch History</h2>
          <p class="text-gray-400 text-sm">No watch history yet.</p>
        </div>

        <!-- Logout -->
        <div class="bg-gray-900 border border-red-900/50 rounded-2xl p-6">
          <h2 class="text-lg font-bold text-red-400 mb-3">🚪 Log Out</h2>
          <p class="text-gray-400 text-sm mb-4">You will need to log in again to access your profile.</p>
          <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 px-6 py-2.5 rounded-lg font-bold">Log Out</button>
        </div>
      `;

      document.getElementById('saveBtn').onclick = () => {
        const u = document.getElementById('editUsername').value.trim();
        const b = document.getElementById('editBio').value.trim();
        const a = document.getElementById('editAvatar').value.trim();
        if (u.length < 2) return alert('Username too short');
        localStorage.setItem('anipulse_username', u);
        localStorage.setItem('anipulse_bio', b);
        localStorage.setItem('anipulse_avatar', a);
        document.getElementById('displayName').textContent = u;
        document.getElementById('displayBio').textContent = b || 'No bio yet.';
        const msg = document.getElementById('saveMsg');
        msg.classList.remove('hidden');
        setTimeout(() => msg.classList.add('hidden'), 2000);
      };

      document.getElementById('logoutBtn').onclick = () => {
        localStorage.removeItem('anipulse_loggedin');
        localStorage.removeItem('anipulse_email');
        localStorage.removeItem('anipulse_username');
        window.location.href = 'index.html';
      };
    }
  </script>
</body>
</html>
