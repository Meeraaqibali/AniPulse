<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse - AniPulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .skeleton { background: linear-gradient(90deg,#1f2937 25%,#374151 50%,#1f2937 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <header class="sticky top-0 z-40 bg-gray-900/90 backdrop-blur-md border-b border-gray-800 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <a href="index.html" class="p-2 rounded-lg hover:bg-gray-800 text-gray-300">←</a>
      <a href="index.html" class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">🎌 AniPulse</a>
    </div>
  </header>

  <main class="p-4 md:p-8">
    <div class="mb-6">
      <h1 id="pageTitle" class="text-3xl font-extrabold">Browse</h1>
      <p id="pageSubtitle" class="text-gray-400 text-sm mt-1">Loading…</p>
    </div>

    <div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    <div id="emptyMsg" class="text-center text-gray-500 mt-16 hidden">
      <p class="text-5xl mb-4">😕</p><p class="text-xl font-semibold text-white">Nothing here yet</p>
    </div>

    <div class="text-center mt-8 hidden" id="loadMoreWrap">
      <button id="loadMoreBtn" class="bg-purple-600 hover:bg-purple-700 px-8 py-3 rounded-lg font-bold">Load More</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script>
    const ANILIST_URL = 'https://graphql.anilist.co';
    const TVMAZE_API = 'https://api.tvmaze.com';
    const params = new URLSearchParams(location.search);
    const TYPE = params.get('type') || 'anime';
    const SORT = params.get('sort') || 'POPULARITY_DESC';
    const STATUS = params.get('status') || null;
    const GENRE = params.get('genre') || null;
    const Q = params.get('q') || null;
    const TITLE = params.get('title') || 'Browse';
    const CATEGORY = params.get('category') || null;

    document.getElementById('pageTitle').textContent = TITLE;

    let page = 1;
    let allItems = [];
    const grid = document.getElementById('grid');

    async function itunesFetch(url) {
      try { const r = await fetch(url); if (r.ok) return await r.json(); } catch(e){}
      try { const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`); const j = await r.json(); return JSON.parse(j.contents); }
      catch(e){ return { results: [] }; }
    }

    function createAnimeCard(a) {
      const t = a.title.english || a.title.romaji;
      return `<a href="anime.html?id=${a.id}" class="group relative overflow-hidden rounded-lg bg-gray-900 hover:ring-2 hover:ring-purple-500 transition-all block">
        <img src="${a.coverImage.large}" loading="lazy" class="w-full aspect-[2/3] object-cover group-hover:scale-105 transition-transform" />
        <div class="absolute top-1.5 right-1.5 bg-black/80 text-yellow-400 text-[10px] px-1.5 py-0.5 rounded">★ ${a.averageScore||'N/A'}</div>
        <div class="p-2"><h3 class="text-xs font-semibold line-clamp-2 h-8">${t}</h3></div>
      </a>`;
    }
    function createMovieCard(m) {
      const t = m.trackName || 'Unknown';
      const y = m.releaseDate ? m.releaseDate.slice(0,4) : '';
      const p = (m.artworkUrl100||'').replace('100x100bb','600x600bb');
      return `<a href="movie.html?id=${m.trackId}" class="group relative overflow-hidden rounded-lg bg-gray-900 hover:ring-2 hover:ring-blue-500 transition-all block">
        <img src="${p}" loading="lazy" class="w-full aspect-[2/3] object-cover group-hover:scale-105 transition-transform" onerror="this.src='https://via.placeholder.com/300x450/1f2937/9333ea?text=No+Poster'" />
        <div class="p-2"><h3 class="text-xs font-semibold line-clamp-2 h-8">${t} ${y?`(${y})`:''}</h3></div>
      </a>`;
    }
    function createTVCard(item) {
      const s = item.show || item;
      const t = s.name || 'Unknown';
      const p = s.image?.medium || 'https://via.placeholder.com/300x450/1f2937/10b981?text=No+Poster';
      const y = s.premiered ? s.premiered.slice(0,4) : '';
      return `<a href="tv.html?id=${s.id}" class="group relative overflow-hidden rounded-lg bg-gray-900 hover:ring-2 hover:ring-green-500 transition-all block">
        <img src="${p}" loading="lazy" class="w-full aspect-[2/3] object-cover group-hover:scale-105 transition-transform" />
        <div class="absolute top-1.5 right-1.5 bg-black/80 text-yellow-400 text-[10px] px-1.5 py-0.5 rounded">★ ${s.rating?.average||'N/A'}</div>
        <div class="p-2"><h3 class="text-xs font-semibold line-clamp-2 h-8">${t} ${y?`(${y})`:''}</h3></div>
      </a>`;
    }

    function showSkeletons(n=12) {
      grid.innerHTML = '';
      for (let i = 0; i < n; i++) grid.innerHTML += `<div class="w-full animate-pulse"><div class="skeleton w-full aspect-[2/3] rounded-lg mb-2"></div><div class="skeleton h-3 rounded w-3/4 mb-1"></div><div class="skeleton h-3 rounded w-1/2"></div></div>`;
    }

    function renderItems(items) {
      items.forEach(item => {
        const html = TYPE === 'anime' ? createAnimeCard(item) : TYPE === 'movie' ? createMovieCard(item) : createTVCard(item);
        const div = document.createElement('div');
        div.className = 'w-full';
        div.innerHTML = html;
        grid.appendChild(div);
      });
      anime({ targets: grid.querySelectorAll('div'), opacity: [0,1], translateY: [20,0], duration: 400, easing: 'easeOutQuad', delay: anime.stagger(30) });
    }

    async function loadAnime() {
      const vars = { page, perPage: 30, sort: [SORT] };
      let filter = 'type: ANIME, sort: $sort';
      if (STATUS) filter += ', status: $status';
      if (GENRE) filter += ', genre: $genre';
      const gql = `query ($page:Int,$perPage:Int,$sort:[MediaSort]${STATUS?',$status:MediaStatus':''}${GENRE?',$genre:String':''}) { Page(page:$page,perPage:$perPage) { pageInfo { hasNextPage } media(${filter}) { id title { romaji english } coverImage { large } averageScore format } } }`;
      if (STATUS) vars.status = STATUS;
      if (GENRE) vars.genre = GENRE;
      const r = await fetch(ANILIST_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ query: gql, variables: vars }) });
      const j = await r.json();
      return { items: j.data?.Page?.media || [], hasNext: j.data?.Page?.pageInfo?.hasNextPage };
    }

    async function loadMovies() {
      // iTunes API doesn't paginate well. Just fetch once with big limit.
      if (page > 1) return { items: [], hasNext: false };
      const term = Q || TITLE;
      const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=movie&entity=movie&limit=50&country=US`;
      const data = await itunesFetch(url);
      return { items: data.results || [], hasNext: false };
    }

    async function loadTV() {
      if (CATEGORY === 'schedule') {
        const today = new Date().toISOString().slice(0,10);
        const r = await fetch(`${TVMAZE_API}/schedule?country=US&date=${today}`);
        const arr = await r.json();
        const seen = new Set();
        const items = arr.filter(i => { if (seen.has(i.show?.id)) return false; seen.add(i.show?.id); return true; }).filter(i => i.show?.image).map(i => ({ show: i.show }));
        return { items, hasNext: false };
      }
      if (page > 1) return { items: [], hasNext: false };
      const term = Q || TITLE;
      const r = await fetch(`${TVMAZE_API}/search/shows?q=${encodeURIComponent(term)}`);
      const arr = await r.json();
      return { items: arr || [], hasNext: false };
    }

    async function loadPage() {
      showSkeletons();
      try {
        let result;
        if (TYPE === 'anime') result = await loadAnime();
        else if (TYPE === 'movie') result = await loadMovies();
        else if (TYPE === 'tv') result = await loadTV();
        grid.innerHTML = '';
        if (!result.items.length) { document.getElementById('emptyMsg').classList.remove('hidden'); document.getElementById('loadMoreWrap').classList.add('hidden'); return; }
        document.getElementById('pageSubtitle').textContent = `${result.items.length} results`;
        renderItems(result.items);
        if (result.hasNext) document.getElementById('loadMoreWrap').classList.remove('hidden');
        else document.getElementById('loadMoreWrap').classList.add('hidden');
      } catch (e) {
        console.error(e);
        grid.innerHTML = '<p class="col-span-full text-center text-red-400 mt-12">Failed to load.</p>';
      }
    }

    document.getElementById('loadMoreBtn').onclick = () => { page++; loadPage(); };
    loadPage();
  </script>
</body>
</html>
