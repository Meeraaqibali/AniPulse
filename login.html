<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - AniPulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl">
    <div class="text-center mb-8">
      <a href="index.html" class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">🎌 AniPulse</a>
      <p id="subtitle" class="text-gray-400 text-sm mt-2">Log in to sync your watch history</p>
    </div>

    <form id="authForm" class="space-y-4">
      <div id="usernameField" class="hidden">
        <label class="block text-sm font-medium text-gray-400 mb-1">Username</label>
        <input id="username" type="text" placeholder="YourDisplayName" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
        <input id="email" type="email" required placeholder="you@example.com" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
        <input id="password" type="password" required minlength="4" placeholder="••••••••" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>
      <p id="error" class="text-red-400 text-sm hidden"></p>
      <button type="submit" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition-colors mt-2">Log In</button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-400">
      <span id="toggleText">Don't have an account?</span>
      <button id="toggleBtn" class="text-purple-400 hover:text-purple-300 font-bold ml-1">Sign Up</button>
    </div>

    <div class="mt-6 text-center">
      <a href="index.html" class="text-gray-500 hover:text-gray-300 text-xs">← Continue as Guest</a>
    </div>
  </div>

  <script>
    let isSignUp = new URLSearchParams(window.location.search).get('signup') === '1';

    const form = document.getElementById('authForm');
    const emailI = document.getElementById('email');
    const passI = document.getElementById('password');
    const userI = document.getElementById('username');
    const userField = document.getElementById('usernameField');
    const submitBtn = document.getElementById('submitBtn');
    const subtitle = document.getElementById('subtitle');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleText = document.getElementById('toggleText');
    const errorEl = document.getElementById('error');

    function updateMode() {
      userField.classList.toggle('hidden', !isSignUp);
      submitBtn.textContent = isSignUp ? 'Create Account' : 'Log In';
      subtitle.textContent = isSignUp ? 'Create your account to save your watchlist' : 'Log in to sync your watch history';
      toggleText.textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
      toggleBtn.textContent = isSignUp ? 'Log In' : 'Sign Up';
      errorEl.classList.add('hidden');
    }

    toggleBtn.onclick = () => { isSignUp = !isSignUp; updateMode(); };
    updateMode();

    form.onsubmit = (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      const email = emailI.value.trim();
      const pass = passI.value;
      const user = userI.value.trim();

      if (isSignUp && user.length < 2) {
        errorEl.textContent = 'Username must be at least 2 characters.';
        errorEl.classList.remove('hidden');
        return;
      }
      if (pass.length < 4) {
        errorEl.textContent = 'Password must be at least 4 characters.';
        errorEl.classList.remove('hidden');
        return;
      }

      // Save (no real backend yet — just localStorage)
      const users = JSON.parse(localStorage.getItem('anipulse_users') || '{}');

      if (isSignUp) {
        if (users[email]) {
          errorEl.textContent = 'An account with this email already exists.';
          errorEl.classList.remove('hidden');
          return;
        }
        users[email] = { username: user, password: pass };
        localStorage.setItem('anipulse_users', JSON.stringify(users));
      } else {
        if (!users[email]) {
          errorEl.textContent = 'No account found with this email. Try Sign Up.';
          errorEl.classList.remove('hidden');
          return;
        }
        if (users[email].password !== pass) {
          errorEl.textContent = 'Incorrect password.';
          errorEl.classList.remove('hidden');
          return;
        }
      }

      // Log in
      localStorage.setItem('anipulse_loggedin', 'true');
      localStorage.setItem('anipulse_email', email);
      localStorage.setItem('anipulse_username', isSignUp ? user : users[email].username);
      window.location.href = 'index.html';
    };
  </script>
</body>
</html>
